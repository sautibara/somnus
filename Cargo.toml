[package]
name = "somnus"
version = "0.1.0"
edition = "2024"
description = "Reserving the name, sorry..."
license = "GPL-3.0-or-later"
repository = "https://github.com/sautibara/somnus"
readme = "README.md"

[dependencies]
auditeur = { version = "0.1.0", path = "../auditeur/auditeur" }
flume = { version = "0.12.0", features = ["async"] }
tokio = { version = "1.48.0", features = ["full"] }
futures = "0.3.30"
imbl = "7.0.1"
facet = "0.46.5"
thiserror = "2.0"
bevy_utils_proc_macros = "0.13.2"
paste = "1.0"
facet-value = "0.46"

[lints]
workspace = true
